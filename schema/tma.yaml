id: https://github.com/debrief/gitma/schema/tma
name: tma
title: TMA via ML data types
description: >-
  Single source of truth for every data type in the TMA via ML proof of concept (constitution
  principle I). Frame: local flat-earth Cartesian, x east, y north, metres, origin at ownship's
  window-start position. Bearings and courses are true, clockwise from north, radians in [0, 2π).
  Speeds in m/s. Times in seconds since window start. All stored floats are float32-rounded.
version: 0.16.0
license: Apache-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  tma: https://github.com/debrief/gitma/schema/tma/
  UCUM: http://unitsofmeasure.org/
default_prefix: tma
default_range: string
imports:
  - linkml:types

enums:
  RecordKind:
    description: Discriminator for records in NDJSON files.
    permissible_values:
      header: { description: Dataset or prediction file header (first line). }
      scenario: { description: One Scenario. }
      prediction: { description: One Prediction. }
  Split:
    description: Dataset split. Train/validation/test are 80/10/10 by scenario index.
    permissible_values:
      train: {}
      validation: {}
      test: {}
      heldout: { description: Held-out geometry with parameter ranges outside training. }
  TrackId:
    permissible_values:
      ownship: {}
      target: {}
  RangeDistribution:
    permissible_values:
      uniform: {}
      log_uniform: {}
  ZigRule:
    description: How each zig's direction and size are chosen (generator 0.3.0, spec 007).
    permissible_values:
      random:
        description: Size from zig_angle_abs_rad, side uniformly ±, regardless of the target.
      across_los:
        description: >-
          Turn across the line of sight: the new course puts the target on the other bow at an
          angle off drawn from los_offset_rad, by the shorter turn. Uses the true bearing at the
          last sample before the turn.
  ManoeuvreKind:
    description: What a target manoeuvre changes (generator 0.5.0, SRD Annex C §C.2).
    permissible_values:
      course:
        description: A rate-limited course change at constant speed (an arc).
      speed:
        description: A constant-acceleration speed change on a constant course.
  PredictionMode:
    permissible_values:
      final: { description: One row at the last timestep of the window. }
      per_timestep: { description: One row per post-zig timestep using bearings up to that time. }
  GateId:
    permissible_values:
      G0: { description: Pipeline verified. }
      G1: {}
      G2: {}
      G3: {}
      G4: { description: "Better than the tuned tracker after a target turn (SRD Annex B §B.4)." }
      G5:
        {
          description: "An end-to-end tracker better than the re-tuned reference overall, at most 10% worse when settled (SRD Annex C §C.5).",
        }
  ModelKind:
    description: Model families of SRD §4.
    permissible_values:
      instantaneous: { description: "Causal single-layer LSTM (operator's running solution)." }
      time_late: { description: "Bidirectional LSTM over the whole window." }
      causal_cnn: { description: "Causal 1-D CNN control for the instantaneous variant." }
      mlp: { description: "MLP over the flattened window, control for the time-late variant." }
      learned_gain_filter:
        description: >-
          Phase 4 tracker T1 (spec 012, SRD Annex C §C.4): a constant-velocity filter with a
          bearings-only update whose gain a GRU of `units` computes each step, in one declared
          filter layer (constitution 1.3.0). Reads the raw feature set; outputs the velocity
          parameterisation.
  StopReason:
    permissible_values:
      max_epochs: {}
      early_stopping: {}
      wall_clock: {}
      diverged: {}
  OutputParameterisation:
    description: How the model's four output channels encode the target's course and speed (spec 008).
    permissible_values:
      course_speed:
        description: >-
          log_range_km, course_sin, course_cos, speed / speed_scale_mps (iterations 1–3).
      velocity:
        description: >-
          log_range_km, vx / velocity_scale_mps, vy / velocity_scale_mps, and a fourth channel
          that carries no loss and is ignored; course and speed are derived from (vx, vy).
      velocity_two_hypothesis:
        description: >-
          Spec 011 (phase 3b): seven channels per row. log_range_km, vx, vy (as velocity) under
          the hypothesis that the target has not turned; the same under the hypothesis that it
          has; and a logit of P(the target's turn has started by this row). Each hypothesis is
          trained only on rows where it is true (the label comes from the stored truth course);
          the logit by binary cross-entropy. The reported estimate is the more probable
          hypothesis's, never an average.
      velocity_gaussian:
        description: >-
          Spec 012 (phase 4, tracker T2): six channels per row. log_range_km, vx, vy (as
          velocity), then the log-variance of each, trained by the Gaussian negative
          log-likelihood. The reported estimate is the mean; prediction rows carry the standard
          deviations (log_range_sd, vx_sd_mps, vy_sd_mps), reported and their calibration
          measured, never gated.
  FeatureSet:
    description: Model input channel sets (spec 003 R6).
    permissible_values:
      raw: { description: "Iteration-1 layout, 10 input channels." }
      derived:
        description: >-
          raw plus bearing_rate_scaled, rate_valid and intercept_scaled (13 channels), computed
          causally from bearings and ownship states up to each row.
  GateResult:
    permissible_values:
      pass: {}
      fail: {}
      inconclusive:
        description: The 95% bootstrap interval straddles the threshold (G1 report, T033).

classes:
  FloatRange:
    description: Closed interval [min, max].
    attributes:
      min: { range: float, required: true }
      max: { range: float, required: true }

  ScenarioParameters:
    description: The random draws that define one scenario.
    attributes:
      window_s:
        {
          range: float,
          required: true,
          unit: { ucum_code: s },
          description: Window length; multiple of dt_s.,
        }
      dt_s: { range: float, required: true, unit: { ucum_code: s }, description: Bearing interval. }
      ownship_speed_mps: { range: float, required: true, unit: { ucum_code: m/s } }
      ownship_course0_rad:
        {
          range: float,
          required: true,
          unit: { ucum_code: rad },
          description: Ownship course on leg 1.,
        }
      zig_angle_rad:
        range: float
        required: true
        unit: { ucum_code: rad }
        description: Signed course change at the zig; positive is clockwise.
      zig_fraction:
        { range: float, required: true, description: Zig time as a fraction of the window. }
      target_range0_m:
        {
          range: float,
          required: true,
          unit: { ucum_code: m },
          description: Range at window start.,
        }
      target_bearing0_rad:
        {
          range: float,
          required: true,
          unit: { ucum_code: rad },
          description: True bearing at window start.,
        }
      target_speed_mps: { range: float, required: true, unit: { ucum_code: m/s } }
      target_course_rad: { range: float, required: true, unit: { ucum_code: rad } }
      noise_sigma_rad:
        {
          range: float,
          required: true,
          unit: { ucum_code: rad },
          description: Bearing noise σ; 0 = noise-free.,
        }
      dropout_fraction:
        { range: float, required: true, description: Probability each bearing is missing. }
      ownship_turn_rate_rad_s:
        range: float
        unit: { ucum_code: rad/s }
        description: >-
          Ownship turn rate at the zig (rate-limited turn, spec 003 US6). Absent or 0: the course
          changes instantaneously, as in generator 0.1.0.
      zig2_delay_s:
        range: float
        unit: { ucum_code: s }
        description: >-
          Second zig (generator 0.3.0, spec 007): time from the first sample on leg 2 to the start
          of the second turn. Absent: one zig, two legs.
      zig2_angle_rad:
        range: float
        unit: { ucum_code: rad }
        description: Signed course change at the second zig; positive is clockwise.
      target_manoeuvre_time_s:
        range: float
        unit: { ucum_code: s }
        description: >-
          Target course change (generator 0.4.0, SRD Annex B §B.2): time the target's turn starts,
          a whole number of samples. Absent: the target holds course.
      target_manoeuvre_angle_rad:
        range: float
        unit: { ucum_code: rad }
        description: Signed target course change; positive is clockwise.
      target_turn_rate_rad_s:
        range: float
        unit: { ucum_code: rad/s }
        description: Target turn rate through its course change.
      target_manoeuvres:
        range: TargetManoeuvre
        multivalued: true
        inlined_as_list: true
        description: >-
          Target manoeuvres in time order (generator 0.5.0, SRD Annex C §C.2), none overlapping.
          Present (possibly empty) only under generator 0.5.0 ranges; then the single-turn fields
          above are absent.

  TargetManoeuvre:
    description: >-
      One target manoeuvre (generator 0.5.0). A course change is an arc at constant speed; a speed
      change is constant acceleration on a constant course.
    attributes:
      kind: { range: ManoeuvreKind, required: true }
      start_time_s:
        range: float
        required: true
        unit: { ucum_code: s }
        description: Time the manoeuvre starts, a whole number of samples.
      change:
        range: float
        required: true
        description: >-
          Signed change: course in rad (positive clockwise) or speed in m/s (positive faster).
      rate:
        range: float
        required: true
        description: Magnitude of the rate of change, rad/s (course) or m/s² (speed).

  ParameterRanges:
    description: >-
      Ranges from which ScenarioParameters are drawn. Initial ownship course, target bearing and
      target course are always uniform on [0, 2π); zig sign is uniform ±.
    attributes:
      window_s: { range: FloatRange, required: true, inlined: true }
      dt_s: { range: float, required: true }
      ownship_speed_mps: { range: FloatRange, required: true, inlined: true }
      zig_angle_abs_rad: { range: FloatRange, required: true, inlined: true }
      zig_fraction: { range: FloatRange, required: true, inlined: true }
      target_range0_m: { range: FloatRange, required: true, inlined: true }
      range_distribution: { range: RangeDistribution, required: true }
      target_speed_mps: { range: FloatRange, required: true, inlined: true }
      noise_sigma_rad_values:
        {
          range: float,
          multivalued: true,
          required: true,
          description: σ drawn uniformly from this set.,
        }
      dropout_fraction: { range: FloatRange, required: true, inlined: true }
      ownship_turn_rate_rad_s:
        range: FloatRange
        inlined: true
        description: Turn rate drawn uniformly per scenario; absent means an instantaneous zig.
      zig_rule:
        range: ZigRule
        description: >-
          How each zig is chosen; absent means random (generators 0.1.0–0.2.0). Under across_los
          zig_angle_abs_rad is still drawn but not used.
      los_offset_rad:
        range: FloatRange
        inlined: true
        description: >-
          Angle off the line of sight, on the other bow, after an across_los turn; required when
          zig_rule is across_los.
      zig2_delay_s:
        range: FloatRange
        inlined: true
        unit: { ucum_code: s }
        description: >-
          Delay from the start of leg 2 to the second turn; absent means one zig. The second zig
          follows zig_rule (and uses the same turn rate as the first).
      target_manoeuvre_fraction:
        range: float
        description: >-
          Probability a scenario's target makes one course change (generator 0.4.0, SRD Annex B
          §B.2); absent means the target always holds course, as generators 0.1.0–0.3.0. When
          present, every scenario draws the manoeuvre parameters (so the PRNG is consumed alike)
          and the window must fit a turn whether or not one is made.
      target_manoeuvre_angle_abs_rad:
        range: FloatRange
        inlined: true
        description: Absolute target course change; the sign is uniform ±.
      target_turn_rate_rad_s:
        range: FloatRange
        inlined: true
        description: Target turn rate, drawn uniformly per scenario.
      target_manoeuvre_after_zig_s:
        range: float
        unit: { ucum_code: s }
        description: Earliest start of the target's turn, after the first sample on leg 2.
      target_manoeuvre_margin_s:
        range: float
        unit: { ucum_code: s }
        description: >-
          Least time from the end of the target's turn to the end of the window, so the gate
          point (manoeuvre + 5 min) is reached.
      target_course_change_count_weights:
        range: float
        multivalued: true
        description: >-
          Generator 0.5.0 (SRD Annex C §C.2): probabilities of 0, 1, 2, … target course changes
          (summing to 1). Present: every scenario draws its manoeuvres this way, with
          target_manoeuvre_angle_abs_rad, target_turn_rate_rad_s, target_manoeuvre_after_zig_s
          and target_manoeuvre_margin_s, and target_manoeuvre_fraction must be absent.
      target_speed_change_fraction:
        range: float
        description: Probability of one target speed change (generator 0.5.0).
      target_speed_change_abs_mps:
        range: FloatRange
        inlined: true
        description: >-
          Absolute speed change; its sign is uniform ±, flipped if the new speed would leave
          target_speed_mps (redrawn if both signs would).
      target_speed_change_rate_mps2:
        range: FloatRange
        inlined: true
        description: Magnitude of the target's acceleration during a speed change.
      target_manoeuvre_spacing_s:
        range: float
        unit: { ucum_code: s }
        description: Least time from the end of one target manoeuvre to the start of the next.
      min_range_m:
        {
          range: float,
          required: true,
          description: Geometries closer than this at any sample are redrawn.,
        }

  PlatformState:
    description: One platform state. Stone Soup analogue GroundTruthState.
    attributes:
      timestamp_s: { range: float, required: true, unit: { ucum_code: s } }
      x_m: { range: float, required: true, unit: { ucum_code: m } }
      y_m: { range: float, required: true, unit: { ucum_code: m } }
      course_rad: { range: float, required: true, unit: { ucum_code: rad } }
      speed_mps: { range: float, required: true, unit: { ucum_code: m/s } }

  Track:
    description: Time-ordered states of one platform. Stone Soup analogue GroundTruthPath.
    attributes:
      id: { range: TrackId, required: true }
      states: { range: PlatformState, multivalued: true, inlined_as_list: true, required: true }

  Observation:
    description: >-
      One bearing from ownship to target. Stone Soup analogue Detection. When valid is false
      (dropout) bearing_rad is 0 and must be ignored.
    attributes:
      timestamp_s: { range: float, required: true, unit: { ucum_code: s } }
      bearing_rad: { range: float, required: true, unit: { ucum_code: rad } }
      valid: { range: boolean, required: true }

  ScenarioMetadata:
    description: Seed, parameter draws and derived slicing keys for one scenario.
    attributes:
      seed:
        { range: string, required: true, description: Scenario seed as a decimal uint64 string. }
      index: { range: integer, required: true, description: Scenario index within the dataset. }
      parameters: { range: ScenarioParameters, required: true, inlined: true }
      samples: { range: integer, required: true, description: Number of timesteps (60–240). }
      zig_index:
        range: integer
        required: true
        description: First timestep on leg 2 (with a rate-limited turn, the first after it completes).
      turn_start_index:
        range: integer
        description: First timestep after the turn starts (absent for an instantaneous zig).
      zig2_index:
        range: integer
        description: >-
          First timestep on leg 3, after the second turn completes (absent with one zig). Gate
          times still count from zig_index.
      turn2_start_index:
        range: integer
        description: First timestep after the second turn starts (absent with one zig or no turn rate).
      manoeuvre_start_index:
        range: integer
        description: >-
          First timestep after the target's turn starts (generator 0.4.0; absent when the target
          holds course). Under generator 0.5.0, after the first manoeuvre starts.
      manoeuvre_index:
        range: integer
        description: >-
          First timestep after the target's turn completes (generator 0.4.0; absent when the
          target holds course). Gate G4 counts time from here, as earlier gates count from
          zig_index. Under generator 0.5.0, after the last manoeuvre completes.
      manoeuvres:
        range: ManoeuvreSpan
        multivalued: true
        inlined_as_list: true
        description: >-
          Generator 0.5.0: each target manoeuvre's sample span, in time order (present, possibly
          empty, only under 0.5.0).
      zig_time_s: { range: float, required: true, unit: { ucum_code: s } }
      mean_range_m: { range: float, required: true, unit: { ucum_code: m } }
      min_range_m: { range: float, required: true, unit: { ucum_code: m } }

  ManoeuvreSpan:
    description: Where one target manoeuvre lies in a scenario's samples (generator 0.5.0).
    attributes:
      kind: { range: ManoeuvreKind, required: true }
      start_index: { range: integer, required: true, description: First timestep after it starts. }
      end_index: { range: integer, required: true, description: First timestep after it completes. }

  Scenario:
    description: One ownship-vs-target run over a window.
    tree_root: true
    attributes:
      record: { range: RecordKind, required: true }
      metadata: { range: ScenarioMetadata, required: true, inlined: true }
      ownship: { range: Track, required: true, inlined: true }
      target: { range: Track, required: true, inlined: true }
      observations: { range: Observation, multivalued: true, inlined_as_list: true, required: true }

  DatasetHeader:
    description: First record of every dataset file.
    attributes:
      record: { range: RecordKind, required: true }
      schema_version: { range: string, required: true }
      generator_version: { range: string, required: true }
      dataset_seed: { range: string, required: true, description: Decimal uint64 string. }
      split: { range: Split, required: true }
      scenario_count: { range: integer, required: true }
      index_start:
        { range: integer, required: true, description: First scenario index (inclusive). }
      index_end: { range: integer, required: true, description: Last scenario index (exclusive). }
      parameter_ranges: { range: ParameterRanges, required: true, inlined: true }
      redraw_count:
        {
          range: integer,
          required: true,
          description: Geometries rejected for violating min_range_m.,
        }
      created_by:
        { range: string, required: true, description: Command line that produced the file. }
      generator_git_commit:
        range: string
        description: Commit of the checkout that ran tma-generate (absent before schema 0.8.0).
      generator_git_dirty:
        range: boolean
        description: >-
          True when that checkout had uncommitted changes (only allowed with --allow-dirty; absent
          before schema 0.8.0).

  NormalisationConstants:
    description: Fixed scaling constants computed from the train split's input channels only.
    attributes:
      position_scale_km: { range: float, required: true }
      speed_scale_mps: { range: float, required: true }
      time_scale_s: { range: float, required: true }
      computed_from: { range: string, required: true, description: Always "inputs_only". }
      train_header_digest:
        { range: string, required: true, description: SHA-256 of the train header. }
      bearing_rate_scale_rad_s:
        range: float
        unit: { ucum_code: rad/s }
        description: >-
          90th percentile of |trailing least-squares bearing rate| over train inputs; required for
          the derived feature set.

  FeatureLayout:
    description: >-
      Documents the model tensors (not stored as records). inputs [N, 240, 10]: bearing_sin,
      bearing_cos, own_x_km, own_y_km, own_course_sin, own_course_cos, own_speed_scaled,
      time_scaled, valid, window_mask; the derived feature set appends bearing_rate_scaled,
      rate_valid, intercept_scaled [N, 240, 13]. targets [N, 240, 6]: log_range_km, course_sin,
      course_cos, speed_scaled, x_km, y_km. loss_mask [N, 240]: window_mask and t ≥ zig_time.
      Features file format 2 also embeds the source DatasetHeader and the source dataset SHA-256.
    attributes:
      feature_set: { range: FeatureSet, description: "Absent means raw." }
      rows: { range: integer, required: true }
      input_channels: { range: string, multivalued: true, required: true }
      target_channels: { range: string, multivalued: true, required: true }

  PredictionRow:
    description: An estimator's target estimate at one timestep.
    attributes:
      timestamp_s: { range: float, required: true, unit: { ucum_code: s } }
      range_m: { range: float, required: true, unit: { ucum_code: m } }
      course_rad: { range: float, required: true, unit: { ucum_code: rad } }
      speed_mps: { range: float, required: true, unit: { ucum_code: m/s } }
      x_m: { range: float, required: true, unit: { ucum_code: m } }
      y_m: { range: float, required: true, unit: { ucum_code: m } }
      converged: { range: boolean, required: true }
      iterations: { range: integer }
      p_manoeuvre:
        range: float
        description: >-
          The estimator's probability that the target's turn has started by this timestep
          (velocity_two_hypothesis networks only; spec 011). Absent for other estimators.
      log_range_sd:
        range: float
        description: >-
          Standard deviation of the estimator's log range (natural log; about the relative range
          error), from a velocity_gaussian network (spec 012). Absent for other estimators.
      vx_sd_mps:
        range: float
        unit: { ucum_code: m/s }
        description: Standard deviation of the estimated east velocity (velocity_gaussian only).
      vy_sd_mps:
        range: float
        unit: { ucum_code: m/s }
        description: Standard deviation of the estimated north velocity (velocity_gaussian only).

  Prediction:
    description: One estimator's output for one scenario.
    attributes:
      record: { range: RecordKind, required: true }
      scenario_index: { range: integer, required: true }
      estimator: { range: string, required: true }
      mode: { range: PredictionMode, required: true }
      rows: { range: PredictionRow, multivalued: true, inlined_as_list: true, required: true }

  PredictionHeader:
    description: First record of every prediction file.
    attributes:
      record: { range: RecordKind, required: true }
      schema_version: { range: string, required: true }
      estimator: { range: string, required: true }
      mode: { range: PredictionMode, required: true }
      dataset_digest: { range: string, required: true, description: SHA-256 of the truth file. }

  MetricsRecord:
    description: Metric values for one estimator on one slice at one evaluation point.
    attributes:
      estimator: { range: string, required: true }
      slice:
        { range: string, required: true, description: '"overall" or e.g. "range_band=5-10km".' }
      point: { range: string, required: true, description: '"final" or "zig+<n>s".' }
      n: { range: integer, required: true }
      excluded: { range: integer, required: true }
      range_rel_median: { range: float }
      range_rel_p90: { range: float }
      course_deg_median: { range: float }
      course_deg_p90: { range: float }
      speed_kt_median: { range: float }
      speed_kt_p90: { range: float }
      gross_error_rate: { range: float }
      non_converged_rate:
        range: float
        description: Fraction of rows with no estimate (scored +∞; explains absent medians/P90).
      position_m_mean:
        range: float
        description: Mean position error over converged rows (non-converged rows count in gross_error_rate).
      position_window_m_median:
        range: float
        unit: { ucum_code: m }
        description: >-
          Median over scenarios of each scenario's mean position error over its predicted rows
          (time-late window-mean position, SRD §5; reported, not gated).
      position_window_m_p90:
        range: float
        unit: { ucum_code: m }
        description: 90th percentile over scenarios of the same per-scenario mean.

  DatasetRef:
    attributes:
      path: { range: string, required: true }
      header: { range: DatasetHeader, required: true, inlined: true }
      digest:
        range: string
        description: SHA-256 of the dataset file (absent in manifests written before schema 0.4.0).

  EstimatorRef:
    attributes:
      name: { range: string, required: true }
      settings_json: { range: string, required: true, description: Estimator settings as JSON. }

  ExperimentManifest:
    description: Everything needed to reproduce an experiment run.
    attributes:
      id: { range: string, required: true }
      created: { range: string, required: true, description: ISO 8601 timestamp. }
      git_commit: { range: string, required: true }
      git_dirty:
        range: boolean
        description: True when the working tree had uncommitted changes (absent before schema 0.4.0).
      node_version:
        range: string
        description: Node.js version that ran the experiment (byte identity is promised per pinned Node).
      schema_version: { range: string, required: true }
      generator_version: { range: string, required: true }
      datasets: { range: DatasetRef, multivalued: true, inlined_as_list: true, required: true }
      estimators: { range: EstimatorRef, multivalued: true, inlined_as_list: true, required: true }
      normalisation: { range: NormalisationConstants, inlined: true }
      command_lines: { range: string, multivalued: true, required: true }

  GateCheck:
    attributes:
      name: { range: string, required: true }
      result: { range: GateResult, required: true }
      detail: { range: string, required: true }
      value: { range: float, description: "Statistic tested (e.g. median range error)." }
      threshold: { range: float, description: Limit the statistic is tested against. }
      ci_low: { range: float, description: Lower bound of the bootstrap interval. }
      ci_high: { range: float, description: Upper bound of the bootstrap interval. }
      ci_level: { range: float, description: "Interval coverage, e.g. 0.95." }

  GateVerdict:
    description: Machine verdict for a gate; the team review records the final decision.
    attributes:
      gate: { range: GateId, required: true }
      result: { range: GateResult, required: true }
      checks: { range: GateCheck, multivalued: true, inlined_as_list: true, required: true }
      decided_by: { range: string, required: true }

  NaiveMeans:
    description: Training-set means used by the naive baseline for one prediction mode.
    attributes:
      log_range_km: { range: float, required: true, description: Mean of ln(range in km). }
      course_sin: { range: float, required: true }
      course_cos: { range: float, required: true }
      speed_mps: { range: float, required: true, unit: { ucum_code: m/s } }
      n: { range: integer, required: true, description: Number of labels averaged. }

  NaiveModel:
    description: >-
      Naive baseline (SRD §5): predicts training-set means. final uses each scenario's last-sample
      label; per_timestep uses every post-zig label.
    attributes:
      schema_version: { range: string, required: true }
      train_digest: { range: string, required: true, description: SHA-256 of the train file. }
      final: { range: NaiveMeans, required: true, inlined: true }
      per_timestep: { range: NaiveMeans, required: true, inlined: true }

  CurvePoint:
    description: One point of an error-vs-time-since-zig curve (curves.csv row).
    attributes:
      estimator: { range: string, required: true }
      t_since_zig_s: { range: float, required: true, unit: { ucum_code: s } }
      n: { range: integer, required: true }
      range_rel_median:
        range: float
        description: Absent when not finite (more than half the rows non-converged), as in MetricsRecord.
      range_rel_p90: { range: float }
      course_deg_median: { range: float }
      speed_kt_median: { range: float }
      gross_error_rate: { range: float, required: true }
      non_converged_rate: { range: float }

  TrainingConfig:
    description: "Hyperparameters and seeds for one training run (SRD §4; constitution III)."
    attributes:
      id:
        range: string
        required: true
        description: "Estimator name used in predictions."
      model_kind:
        range: ModelKind
        required: true
      units:
        range: integer
        required: true
        description: "LSTM units (per direction), conv filters or dense width."
      kernel_size:
        range: integer
        description: "Causal CNN kernel size."
      layers:
        range: integer
        description: >-
          Stacked layers: causal CNN conv layers (no dilation; default 3), or recurrent layers
          for instantaneous and time_late (default 1; each returns sequences; spec 003 R20).
      learning_rate:
        range: float
        required: true
      batch_size:
        range: integer
        required: true
      max_epochs:
        range: integer
        required: true
      patience:
        range: integer
        required: true
        description: "Epochs without validation improvement before stopping."
      max_wall_s:
        range: float
        required: true
        description: "Wall-clock cap in seconds."
      loss_weight_range:
        range: float
        required: true
      loss_weight_course:
        range: float
        required: true
      loss_weight_speed:
        range: float
        required: true
      loss_weight_manoeuvre:
        range: float
        description: >-
          Weight of the turn-probability cross-entropy term (velocity_two_hypothesis only; spec
          011). Absent means 1.
      train_seed:
        range: string
        required: true
        description: "Decimal uint64; derives initializer seeds and batch order."
      train_limit:
        range: integer
        description: "Use only the first N training scenarios (tests and smoke runs)."
      shuffle_labels:
        range: boolean
        required: true
        description: "Permute targets across scenarios (leakage check)."
      feature_set:
        range: FeatureSet
        description: "Input channel set; absent means raw. Must match the features files."
      output_parameterisation:
        range: OutputParameterisation
        description: >-
          Output encoding; absent means course_speed. With velocity, loss_weight_speed weights
          each velocity component and loss_weight_course is unused (spec 008).
      velocity_scale_mps:
        range: float
        description: >-
          Velocity scale in m/s for the velocity parameterisation (required with it): the top of
          the generator's target speed range, a constant of the problem, never a truth statistic.
      length_bucketing:
        range: boolean
        description: >-
          Length bucketing (research R15; default false). Each group of bucket_batches batches of
          the epoch's seeded permutation is sorted by valid length, cut into batches whose rows are
          trimmed to the longest window, and the batch order is shuffled with a seed derived from
          train_seed and the epoch. The model takes a variable time dimension. Not for mlp.
      bucket_batches:
        range: integer
        minimum_value: 1
        description: "Batches per length-bucketing group (default 16)."
      tfjs_threads:
        range: integer
        minimum_value: 1
        description: >-
          TensorFlow intra-op and inter-op thread count, set by tma-train through
          TF_NUM_INTRAOP_THREADS and TF_NUM_INTEROP_THREADS before tfjs-node loads. Absent: the
          TensorFlow default (one per core) or whatever the environment sets.

  EpochRecord:
    attributes:
      epoch:
        range: integer
        required: true
      train_loss:
        range: float
        required: true
      val_loss:
        range: float
        required: true
      seconds:
        range: float
        required: true
        description: "Cumulative wall time."

  Continuation:
    description: >-
      The committed model a seeded continuation started from (scripts/train-continue.mjs; spec
      003 decision 14, spec 004 decision 15). Its epoch records up to best_epoch are kept in the
      continued run's manifest, with their val_loss as recorded under the earlier config.
    attributes:
      weights_digest:
        range: string
        required: true
        description: "SHA-256 of the weights the continuation resumed from (the source's best epoch)."
      best_epoch:
        range: integer
        required: true
      val_loss:
        range: float
        required: true
        description: "The source's best-epoch validation loss under the source's config."
      rescored_val_loss:
        range: float
        description: >-
          The source's best weights re-scored under the continued run's loss, written by tma-train
          when it resumed (spec 004 FR-002). With best_epoch and best_val_loss it makes the kept
          weights auditable: a run whose best_epoch is the source's must have best_val_loss equal
          to this value and weights_digest equal to the source's.
      git_commit:
        range: string
        description: "The source model's training-code commit, when it recorded one."

  ModelManifest:
    description: "Everything needed to reproduce and identify a trained model."
    attributes:
      id:
        range: string
        required: true
      config:
        range: TrainingConfig
        required: true
        inlined: true
      schema_version:
        range: string
        required: true
      generator_version:
        range: string
        required: true
      train_features_digest:
        range: string
        required: true
      val_features_digest:
        range: string
        required: true
      normalisation:
        range: NormalisationConstants
        required: true
        inlined: true
      epochs:
        range: EpochRecord
        required: true
        multivalued: true
        inlined_as_list: true
      best_epoch:
        range: integer
        required: true
      best_val_loss:
        range: float
        description: >-
          The validation loss a later epoch must beat, under this manifest's config: the best
          epoch's val_loss, or, after a continuation changed the loss, the best weights re-scored
          under the new loss (spec 004 FR-002). Persisted so a chained job resumes against the
          same value. Absent before schema 0.8.2 (then the best epoch's recorded val_loss).
      continued_from:
        range: Continuation
        inlined: true
        description: "Present when the run was seeded from a committed model (absent before schema 0.8.2)."
      stop_reason:
        range: StopReason
      complete:
        range: boolean
        required: true
        description: "False while training is in progress (checkpoint)."
      wall_s:
        range: float
        required: true
      parameter_count:
        range: integer
        required: true
      tfjs_node_version:
        range: string
        required: true
      node_version:
        range: string
        required: true
      cpu_model:
        range: string
        required: true
      tf_intraop_threads:
        range: integer
        description: >-
          TF_NUM_INTRAOP_THREADS in force when training ran (absent: unset, so the TensorFlow
          default of one per core).
      tf_interop_threads:
        range: integer
        description: "TF_NUM_INTEROP_THREADS in force when training ran (absent: unset)."
      weights_digest:
        range: string
        required: true
        description: "SHA-256 of best-epoch weights."
      git_commit:
        range: string
        description: "Commit of the training code, read when training started (absent before schema 0.6.0)."
      git_dirty:
        range: boolean
        description: "True when the working tree had uncommitted changes when training started (absent before schema 0.6.0)."
      source_dataset_header:
        range: DatasetHeader
        inlined: true
        description: "Header of the dataset the train features came from (lineage; absent before schema 0.8.0)."
      g0_experiment:
        range: string
        description: "Id of the G0 experiment whose verdict the training guard accepted."

  PairedComparison:
    description: >-
      A model and a reference estimator compared on rows both answered (converged and finite),
      with each estimator's coverage reported separately (spec 003 R9).
    attributes:
      estimator: { range: string, required: true }
      reference: { range: string, required: true }
      slice: { range: string, required: true }
      point: { range: string, required: true }
      n_common: { range: integer, required: true }
      coverage_estimator: { range: float, required: true, description: "Answered / scored." }
      coverage_reference: { range: float, required: true, description: "Answered / scored." }
      range_rel_median: { range: float }
      range_rel_median_ref: { range: float }
      range_rel_p90: { range: float }
      range_rel_p90_ref: { range: float }
      course_deg_median: { range: float }
      course_deg_median_ref: { range: float }
      speed_kt_median: { range: float }
      speed_kt_median_ref: { range: float }
      gross_error_rate: { range: float }
      gross_error_rate_ref: { range: float }

  ChangeDecision:
    description: >-
      The single change of the iteration's change round, fixed from validation evidence and
      committed before phase B trains (spec 003 R5).
    attributes:
      phase_a_experiment: { range: string, required: true }
      stalled:
        range: boolean
        required: true
        description: Any gated criterion failed or was inconclusive on validation.
      change: { range: string, required: true, description: "e.g. feature_set: derived" }
      rationale: { range: string, required: true, description: "Validation evidence cited." }
      carried_set_rule: { range: string, required: true }
      decided_at: { range: string, required: true }
      git_commit: { range: string, required: true }
      plan:
        range: string
        description: >-
          The plan this decision pre-registers (configs/<…>/plan.json). Required from iteration 3
          (spec 007): tma-g2 scores a test split only with the decision that names its plan.
      test_seed:
        range: string
        description: >-
          Dataset seed of the test split the decision commits to (the plan's fresh_test seed, or
          its dataset seed); tma-g2 checks it against the plan.
      rescore_of:
        range: string
        description: >-
          The experiment directory of the inconclusive gate this decision re-scores (SRD §7: one
          re-score on a larger fresh-seed test set; e.g. experiments/20261024-i4-g2). When present,
          tma-g2 runs in re-score mode (--rescore-of): the frozen carried models are bound by
          model_digests instead of by training ancestry, the re-scored gate must be inconclusive
          and not itself a re-score, and the fresh test seed must differ from its test seed.
      model_digests:
        range: ModelDigest
        multivalued: true
        inlined_as_list: true
        description: >-
          The frozen carried models a re-score scores, by manifest id, with the SHA-256 of each
          one's weights.bin, manifest.json and model.json; tma-g2 refuses a re-score whose
          carried set or any of those files differs.
      fresh_test_count:
        range: integer
        description: >-
          The dataset count whose test split a re-score scores (the plan's
          dataset.fresh_test.count; schema 0.11.1); tma-g2 refuses a plan with another count.
      reference_estimator:
        range: string
        description: >-
          G4 (spec 010, schema 0.13.0): the frozen reference tracker's estimator name, which
          encodes every tuning parameter (e.g. imm-cv0-ct0.03-w0.003-s0.0001-r4); tma-g4 refuses
          reference predictions with another name.
      carried_model:
        range: string
        description: >-
          G4: the manifest id of the one carried network (Annex B §B.4); tma-g4 refuses network
          predictions from another model.
      carried_models:
        range: string
        multivalued: true
        description: >-
          G5 (spec 012, schema 0.16.0): the manifest ids of the carried trackers (one or both of
          T1 and T2, Annex C §C.5), each with its own plan in `plans`, in the same order; tma-g5
          refuses tracker predictions from any other model.
      plans:
        range: string
        multivalued: true
        description: >-
          G5: the plan of each carried tracker (configs/phase4/<x>/plan.json), in the order of
          carried_models; they share one dataset and one fresh test seed.

  ModelDigest:
    description: >-
      A trained model named by its manifest id and the SHA-256 of its files (schema 0.11.0;
      manifest and model.json digests from 0.11.1).
    attributes:
      model: { range: string, required: true, description: "The model's manifest id." }
      weights_sha256:
        range: string
        required: true
        description: "SHA-256 (hex) of the model's weights.bin; equals its manifest weights_digest."
      manifest_sha256:
        range: string
        required: true
        description: "SHA-256 (hex) of the model's manifest.json (schema 0.11.1)."
      model_json_sha256:
        range: string
        required: true
        description: "SHA-256 (hex) of the model's model.json, its topology (schema 0.11.1)."
