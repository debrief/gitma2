name: Long engagements (spec 023)

# Runs when configs/long/run.json changes on a push to any branch but main (a merge would re-run
# the last study's whole plan), or by hand:
#   jobs   [{part: realtime|realtime-inc|timelate|carry|carry2|jointpair|scaling, index, shards,
#           lengths, config, contact, block_s, indices, pair}]: one CI job per shard (imm: --indices a-b)
#          (scaling: one job per entry, its comma-separated period lengths in seconds)
# Each job runs `tma2-long <part> --index <i> --shard <s>/<n>`; a collect job commits every
# output to results/long-<run id> (experiments/long-runs/<run id>/). CPU only; no secrets.
# An investigation's measurement (issue #42), never a gate result.

on:
  push:
    branches-ignore: [main]
    paths: ["configs/long/run.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python3 - configs/long/run.json >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          m = []
          for j in json.load(open(sys.argv[1]))["jobs"]:
              for s in range(int(j.get("shards", 1))):
                  extra = []
                  if "lengths" in j:
                      extra += ["--lengths", j["lengths"]]
                  if "config" in j:
                      extra += ["--config", j["config"]]
                  if "contact" in j:
                      extra += ["--contact", str(j["contact"])]
                  if "block_s" in j:
                      extra += ["--block-s", str(j["block_s"])]
                  if "indices" in j:
                      extra += ["--indices", j["indices"]]
                  if "pair" in j:
                      extra += ["--pair", str(j["pair"])]
                  stem = j["config"].rsplit("/", 1)[-1].removesuffix(".json") if "config" in j else "long"
                  tag = f"{stem}-c{j.get('contact', 1)}-{j['part']}-{j.get('indices', j['index'])}-{s}" + (f"-{j['lengths']}" if "lengths" in j else "") + (f"-p{j['pair']}" if "pair" in j else "")
                  m.append({"part": j["part"], "index": j["index"], "shard": f"{s}/{j.get('shards', 1)}", "tag": tag, "extra": " ".join(extra)})
          print("jobs=" + json.dumps({"include": m}))
          PY

  run:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.jobs) }}
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          uv run tma2-long "${{ matrix.part }}" --index "${{ matrix.index }}" --shard "${{ matrix.shard }}" --out "$RUNNER_TEMP/out" ${{ matrix.extra }} | tee "$RUNNER_TEMP/out/${{ matrix.tag }}.log"
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.tag }}
          path: ${{ runner.temp }}/out/*

  collect:
    needs: [setup, run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: ${{ runner.temp }}/out
          merge-multiple: true
      - name: Push the results branch
        run: |
          DEST="experiments/long-runs/$GITHUB_RUN_ID"
          BRANCH="results/long-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # an orphan branch holding only the results: a branch whose history carries this
          # workflow's own edits is refused to the Actions token (no `workflows` permission)
          git checkout --orphan "$BRANCH"
          git rm -rq --cached .
          mkdir -p "$DEST"
          cp -r "$RUNNER_TEMP/out/." "$DEST/"
          cp configs/long/run.json "$DEST/run.json"
          echo "{\"run_id\": \"$GITHUB_RUN_ID\", \"commit\": \"$GITHUB_SHA\", \"cpu_model\": \"$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)\"}" > "$DEST/ci.json"
          git add -f "$DEST"
          git commit -m "Long engagements run $GITHUB_RUN_ID"
          git push origin "$BRANCH"
