name: Time-late (spec 013)

# Push `timelate/<name>` with a run configs/timelate/runs/<name>.json:
#   plan        the Gate T plan (splits, prior, settings, temperature, criteria)
#   seed, count the seed and engagements generated per split (5-second data)
#   splits      {<split>: {start, periods}}: sigma = 1 deg ordinals cut into periods
#   shard_size  periods per job
#   thinning, systems  (spec 014, optional) override the plan's settings for this run
# A plan split may name a `condition` (a spec 010 mismatch condition id) for its data.
# Jobs: solve (one per split shard: C'' as a track, the evidence search, the reference) ->
# score (tma2-tlscore). Results: results/timelate-<name>-<run id>. CPU only; no secrets.

on:
  push:
    branches: ["timelate/**"]

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.plan.outputs.name }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          NAME="${GITHUB_REF_NAME#timelate/}"
          test -f "configs/timelate/runs/$NAME.json"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          python3 - "configs/timelate/runs/$NAME.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          size, m = r["shard_size"], []
          for split, s in r["splits"].items():
              n, i = s["periods"], 0
              while i * size < n:
                  m.append({"split": split, "shard": i, "start": s.get("start", 0) + i * size, "count": min(size, n - i * size)})
                  i += 1
          print("shards=" + json.dumps({"include": m}))
          PY

  solve:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.shards) }}
    env:
      RUN: configs/timelate/runs/${{ needs.setup.outputs.name }}.json
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Generate the split
        run: |
          python3 - "$RUN" "${{ matrix.split }}" > "$RUNNER_TEMP/gen" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          p = json.load(open(r["plan"]))
          s = p["splits"][sys.argv[2]]
          print(r["plan"], r["seed"], r["count"], s["ranges"], s["heldout_ranges"], p["data_split"], s.get("condition", "clean"), r.get("thinning", "plan"), ",".join(r.get("systems", [])) or "plan")
          PY
          read -r PLAN SEED COUNT RANGES HELDOUT DSPLIT CONDITION THIN SYSTEMS < "$RUNNER_TEMP/gen"
          MISMATCH=()
          if [ "$CONDITION" != "clean" ]; then MISMATCH=(--mismatch "configs/gateh/conditions.json#$CONDITION"); fi
          uv run tma2-generate --seed "$SEED" --count "$COUNT" --ranges "$RANGES" --heldout-ranges "$HELDOUT" --format f32pack --out "$RUNNER_TEMP/data" "${MISMATCH[@]}"
          echo "THIN=$THIN" >> "$GITHUB_ENV"
          echo "SYSTEMS=$SYSTEMS" >> "$GITHUB_ENV"
          echo "PLAN=$PLAN" >> "$GITHUB_ENV"
          echo "TRUTH=$RUNNER_TEMP/data/$DSPLIT.f32pack" >> "$GITHUB_ENV"
      - name: Solve
        run: |
          mkdir -p "$RUNNER_TEMP/shards"
          EXTRA=()
          if [ "$THIN" != "plan" ]; then EXTRA+=(--thin "$THIN"); fi
          if [ "$SYSTEMS" != "plan" ]; then EXTRA+=(--systems "$SYSTEMS"); fi
          # spec 016: a run file may name the learned model's seeds (results branch, folder,
          # training plan); their tracks are predicted here, outside the checkout, and scored
          # beside the controls
          python3 - "$RUN" > "$RUNNER_TEMP/learned" <<'PY'
          import json, sys
          for name, v in (json.load(open(sys.argv[1])).get("learned") or {}).items():
              print(name, v["branch"], v["dir"], v["config"])
          PY
          mkdir -p "$RUNNER_TEMP/ckpt" "$RUNNER_TEMP/lp"
          while read -r LNAME LBRANCH LDIR LCONFIG; do
            git fetch -q --depth 1 origin "$LBRANCH"
            git show "FETCH_HEAD:$LDIR/checkpoint.safetensors" > "$RUNNER_TEMP/ckpt/$LNAME.safetensors"
            uv run tma2-tlpredict --weights "$RUNNER_TEMP/ckpt/$LNAME.safetensors" --config "$LCONFIG" --in "$TRUTH" --plan "$PLAN" --split "${{ matrix.split }}" --start "${{ matrix.start }}" --count "${{ matrix.count }}" --out "$RUNNER_TEMP/lp/$LNAME"
            EXTRA+=(--learned "$LNAME=$RUNNER_TEMP/lp/$LNAME")
          done < "$RUNNER_TEMP/learned"
          uv run tma2-tlsolve --in "$TRUTH" --plan "$PLAN" --split "${{ matrix.split }}" --start "${{ matrix.start }}" --count "${{ matrix.count }}" --out "$RUNNER_TEMP/shards/${{ matrix.split }}.${{ matrix.shard }}" "${EXTRA[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.split }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shards/*

  score:
    needs: [setup, solve]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NAME: ${{ needs.setup.outputs.name }}
      RUN: configs/timelate/runs/${{ needs.setup.outputs.name }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Score
        run: |
          PLAN="$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['plan'])" "$RUN")"
          mkdir -p "$RUNNER_TEMP/result"
          set -o pipefail
          RECORD="$(python3 -c "import json, sys; print(json.load(open(sys.argv[1])).get('controls_record', ''))" "$RUN")"
          EXTRA=()
          if [ -n "$RECORD" ]; then EXTRA+=(--controls-record "$RECORD"); fi
          uv run tma2-tlscore --shards "$RUNNER_TEMP/shards" --plan "$PLAN" --out "$RUNNER_TEMP/result" "${EXTRA[@]}" | tee "$RUNNER_TEMP/result/score.txt"
          cp "$RUN" "$RUNNER_TEMP/result/run.json"
          cp "$PLAN" "$RUNNER_TEMP/result/plan.json"
          echo "{\"run_id\": \"$GITHUB_RUN_ID\", \"commit\": \"$GITHUB_SHA\", \"cpu_model\": \"$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)\"}" > "$RUNNER_TEMP/result/ci.json"
      - name: Push the results branch
        run: |
          DEST="experiments/timelate-runs/$NAME-$GITHUB_RUN_ID"
          BRANCH="results/timelate-$NAME-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mkdir -p "$DEST"
          cp -r "$RUNNER_TEMP/result/." "$DEST/"
          git add -f "$DEST"
          git commit -m "Time-late run $NAME ($GITHUB_RUN_ID)"
          git push origin "$BRANCH"
