name: Reference tuning

# Spec 006 T032: re-tune the IMM and EKF on generator 0.6.0's validation split (seed 314) with
# spec 004's grids (`tma2-tune --criterion g5`), on a 4-core runner (about 2.5 h; a cloud session
# can be reclaimed first). The data are regenerated at the commit that made them (d72cb81, the
# merge of PR 13): headers carry no timestamp, so the bytes reproduce exactly, and the split's
# SHA-256 is checked against the digest committed with the pipeline gate. The record goes to
# `results/man2-tune-<run id>`; nothing merges automatically.

on:
  push:
    branches: ["tune/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DATA: ${{ github.workspace }}/../man2-val
  GEN_COMMIT: d72cb81d43297f34cad9dc06a76dc7b31c8fbea2
  DIGESTS: experiments/20261104-g0-man2/dataset-digests/seed314-digests.json

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Regenerate seed 314 at the generating commit and check its digest
        run: |
          git worktree add "$RUNNER_TEMP/gen" "$GEN_COMMIT"
          (cd "$RUNNER_TEMP/gen" && uv sync && uv run tma2-generate --seed 314 --count 100000 \
            --ranges configs/man2-ranges.json --heldout-ranges configs/man2-heldout.json \
            --format f32pack --out "$DATA")
          want=$(python3 -c "import json; print(json.load(open('$DIGESTS'))['validation.f32pack'])")
          got=$(sha256sum "$DATA/validation.f32pack" | cut -d' ' -f1)
          echo "validation.f32pack: $got (committed $want)"
          [ "$got" = "$want" ]
          rm -f "$DATA/train.f32pack"
      - run: uv sync
      - name: Tune (spec 004's G5 grids, 2,000 σ = 1° scenarios, four workers)
        run: |
          EXP="experiments/$(date -u +%Y%m%d)-man2-tune"
          echo "EXP=$EXP" >> "$GITHUB_ENV"
          uv run tma2-tune --criterion g5 --validation "$DATA/validation.f32pack" \
            --experiment "$EXP" --scenarios 2000 --workers 4
          printf '{"run_id": "%s", "commit": "%s", "cpu": "%s"}\n' "${{ github.run_id }}" \
            "${{ github.sha }}" "$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)" \
            > "$EXP/run.json"
      - name: Push the results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="results/man2-tune-${{ github.run_id }}"
          git checkout -b "$BR"
          git add -f "$EXP"
          git commit -qm "experiments: MAN2 reference tuning (run ${{ github.run_id }}, ${{ github.sha }})"
          git push origin "$BR"
