name: GPU training (spec 012)

# The regressor control on a Modal T4. Push `gputrain/<name>` with a plan
# configs/regress/<name>.json: {config, segments (1 or 2), segment_limit_seconds (at most 18000)}.
# Before anything runs, the ledger sums the GPU seconds on every results/gputrain-* branch and
# refuses a plan whose limit would take the total past the cap (68 T4-hours: the owner's $50 of 2026-11-10 at the measured $0.66 an hour, kept under the $45 Modal enforces).
# Each segment is one `modal run` that this job waits for; the second resumes from the first's
# checkpoint on the Modal volume. Results: results/gputrain-<name>-<run id>.
# Secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are the owner's; this workflow runs on pushes to
# this repository's branches only, never on pull requests.

on:
  push:
    branches: ["gputrain/**"]

permissions:
  contents: write

# One run per plan at a time; different plans may run side by side (the ledger cannot see a
# run still in progress, so the plans launched together must fit the cap together).
concurrency:
  group: gputrain-${{ github.ref }}
  cancel-in-progress: false

env:
  CAP_HOURS: "68"

jobs:
  segment1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      name: ${{ steps.plan.outputs.name }}
      segments: ${{ steps.plan.outputs.segments }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - id: plan
        run: |
          NAME="${GITHUB_REF_NAME#gputrain/}"
          test -f "configs/regress/$NAME.json"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "segments=$(python3 -c "import json; print(json.load(open('configs/regress/$NAME.json'))['segments'])")" >> "$GITHUB_OUTPUT"
      - name: Ledger
        run: uv run python -m tma2.regress.ledger --cap-hours "$CAP_HOURS" --plan "configs/regress/${{ steps.plan.outputs.name }}.json"
      - name: Train (segment 1)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "MODAL_TOKEN_ID is not set (owner-only)"; exit 1; }
          uv run --with modal modal run scripts/modal_train.py \
            --plan "configs/regress/${{ steps.plan.outputs.name }}.json" \
            --out "$RUNNER_TEMP/out" --run-name "${{ steps.plan.outputs.name }}-${{ github.run_id }}" \
            --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: segment1
          path: ${{ runner.temp }}/out
  segment2:
    needs: segment1
    if: needs.segment1.outputs.segments == '2'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Train (segment 2)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          uv run --with modal modal run scripts/modal_train.py \
            --plan "configs/regress/${{ needs.segment1.outputs.name }}.json" \
            --out "$RUNNER_TEMP/out" --run-name "${{ needs.segment1.outputs.name }}-${{ github.run_id }}" \
            --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: segment2
          path: ${{ runner.temp }}/out
  publish:
    needs: [segment1, segment2]
    if: always() && needs.segment1.result == 'success' && (needs.segment2.result == 'success' || needs.segment2.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.segment1.outputs.segments == '2' && 'segment2' || 'segment1' }}
          path: ${{ runner.temp }}/out
      - name: Push the results branch
        run: |
          NAME="${{ needs.segment1.outputs.name }}"
          OUT="experiments/gputrain-runs/$NAME-${{ github.run_id }}"
          mkdir -p "$OUT"
          cp "$RUNNER_TEMP/out/run.json" "$RUNNER_TEMP/out/checkpoint.safetensors" "$OUT/"
          cp "configs/regress/$NAME.json" "$OUT/plan.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="results/gputrain-$NAME-${{ github.run_id }}"
          git checkout -b "$BR"
          git add -f "$OUT"
          git commit -qm "experiments: GPU training $NAME (run ${{ github.run_id }}, ${{ github.sha }})"
          git push origin "$BR"
