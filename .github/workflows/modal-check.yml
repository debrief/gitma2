name: Modal credentials check (spec 012)

# Push `modal-check/<anything>`: confirms the two repository secrets exist and that Modal accepts
# them, by listing the workspace's apps. Starts no container and uses no GPU time.

on:
  push:
    branches: ["modal-check/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Secrets present
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "::error::MODAL_TOKEN_ID is not set"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "::error::MODAL_TOKEN_SECRET is not set"; exit 1; }
          echo "both secrets are set"
      - name: Modal accepts them
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          uvx modal --version
          uvx modal app list
