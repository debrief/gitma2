name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run mypy

  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Generated types are not stale
        run: uv run python scripts/gen_types.py --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Warm the numba cache
        run: uv run python -c "from tma2.sim.generate import warm_up; warm_up()"
      - name: Unit, golden, conformance and performance tests
        run: uv run pytest -q

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync
      - name: Data dictionary from the schema
        run: uv run python scripts/data_dictionary.py
      - name: Site build
        working-directory: site
        run: npm ci && npm run build

  onnx-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: uv sync
      - name: Export the toy model (double and float32) and run the Python runtime leg
        run: uv run python -m tma2.export.onnx_export --out conformance/onnx/export
      - name: Browser (WASM) leg under Playwright
        working-directory: conformance/onnx
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node wasm_leg.mjs --dir export/f64 --out results.json
      - name: Java leg (deferred with a reason if the runtime cannot be fetched)
        run: uv run python conformance/onnx/java_leg.py conformance/onnx/export/f64
      - uses: actions/upload-artifact@v4
        with:
          name: onnx-conformance
          path: conformance/onnx/results.json

  p0:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'p0')
    needs: onnx-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Browser and Java legs from the conformance job (checked against a fresh export's digest)
        uses: actions/download-artifact@v4
        with:
          name: onnx-conformance
          path: conformance/onnx
      - name: Oracle dataset (seed 301, phase-4 ranges), cached by the generator's inputs and code
        uses: actions/cache@v4
        with:
          path: data/p0
          key: p0-data-seed301-${{ hashFiles('tests/fixtures/gitma/phase4-seed777/ranges.json', 'tests/fixtures/gitma/phase4-seed777/heldout-ranges.json', 'src/tma2/sim/**', 'src/tma2/data/**', 'schema/tma.yaml') }}
      - run: |
          test -f data/p0/validation.f32pack || uv run tma2-generate --seed 301 --count 100000 --out data/p0 \
            --ranges tests/fixtures/gitma/phase4-seed777/ranges.json \
            --heldout-ranges tests/fixtures/gitma/phase4-seed777/heldout-ranges.json --format f32pack
      - name: gitma at the commit P0 names (for the at-scale IMM check)
        uses: actions/checkout@v4
        with:
          repository: debrief/Gitma
          ref: d0aec60a05b8664a586af87bf58232d0d1767c4a
          path: gitma
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: gitma/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: gitma/.nvmrc
      - name: gitma's seed-301 dataset and IMM predictions, cached by gitma commit
        uses: actions/cache@v4
        with:
          path: data/gitma-ref
          key: p0-gitma-ref-d0aec60
      - run: test -f data/gitma-ref/validation-imm.ndjson || scripts/gitma_reference.sh gitma data/gitma-ref
      - name: Gate P0 (exit 3, gate not passed, fails the job)
        run: |
          uv run tma2-p0 --experiment experiments/ci-p0 --oracle-data data/p0 --work data/p0-work \
            --gitma-data data/gitma-ref --gitma-imm data/gitma-ref/validation-imm.ndjson
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-experiment
          path: experiments/ci-p0
