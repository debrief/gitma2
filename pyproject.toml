[project]
name = "tma2"
version = "0.1.0"
description = "TMA via ML, second attempt: simulated bearings-only data, references and learned estimators"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "numba>=0.61",
  "pydantic>=2.7,<3",
  "torch>=2.15.0",
  "onnx>=1.23.2",
  "onnxruntime>=1.31.1",
  "safetensors>=0.4",
]

[project.scripts]
tma2-generate = "tma2.cli.generate:main"
tma2-solve = "tma2.cli.estimators:solve_main"
tma2-track = "tma2.cli.estimators:track_main"
tma2-naive = "tma2.cli.estimators:naive_main"
tma2-crb = "tma2.cli.estimators:crb_main"
tma2-eval = "tma2.cli.evaluate:main"
tma2-oracle = "tma2.cli.oracle:main"
tma2-p0 = "tma2.cli.p0:main"
tma2-train = "tma2.cli.train:main"
tma2-predict = "tma2.cli.predict:main"
tma2-tune = "tma2.cli.tune:main"

[dependency-groups]
dev = [
  "linkml==1.12.0",
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.hatch.build.targets.wheel]
packages = ["src/tma2"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/tma2/types/generated", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]
ignore = ["N803", "N806"]  # kernel code mirrors gitma's names (P, R, TI arrays)

[tool.ruff.lint.per-file-ignores]
"scripts/research/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tma2", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "typings"
files = ["src", "scripts", "tests"]
exclude = ["src/tma2/types/generated/", "scripts/research/"]

[[tool.mypy.overrides]]
module = ["tma2.types.generated.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["linkml.*", "linkml_runtime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
